services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avito_kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-avito_kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito_kitchen}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: services/kitchen-api/Dockerfile
    command: ["python", "-m", "avito_kitchen.infrastructure.migrations"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://avito_kitchen:avito_kitchen@postgres:5432/avito_kitchen}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kitchen-api:
    build:
      context: .
      dockerfile: services/kitchen-api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://avito_kitchen:avito_kitchen@postgres:5432/avito_kitchen}
      PARTNER_API_TOKEN: ${PARTNER_API_TOKEN:-demo-partner-token-change-me}
      PARTNER_RESTAURANT_ID: ${PARTNER_RESTAURANT_ID:-10000000-0000-4000-8000-000000000001}
    ports:
      - "${API_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
